name: Build Check

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  # From the 2026 wpilibsuite/vendor-template CI. Cheap, and catches a tampered
  # or mismatched gradle wrapper before anything else runs.
  validation:
    name: "Validation"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: gradle/actions/wrapper-validation@v6

  build-java:
    needs: [validation]
    name: "Build - Java"
    runs-on: ubuntu-22.04
    container: wpilib/ubuntu-base:22.04
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: true
          fetch-depth: 0

      - name: Fetch all history and metadata
        run: |
          git config --global --add safe.directory /__w/${{ github.event.repository.name }}/${{ github.event.repository.name }}

      - name: Ensure spotless is applied
        run: ./gradlew spotlessApply

      - name: Build with Gradle
        run: ./gradlew build -PjavaOnly -PreleaseMode

      - uses: actions/upload-artifact@v7
        with:
          name: Java
          path: build/allOutputs

# ---------------------------------------------------------------------------
# C++ builds, disabled while the library migrates to Java for 2026.
